name: Unzip project on GitHub

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and move files to repo root
        run: |
          if [ ! -f "Cursor Ai-T_1_Step_4.zip" ]; then
            echo "ZIP file not found in repo root."
            exit 1
          fi
          unzip -q "Cursor Ai-T_1_Step_4.zip"
          shopt -s dotglob
          mv "Cursor Ai-T_1_Step_4"/* .
          rmdir "Cursor Ai-T_1_Step_4"
          rm "Cursor Ai-T_1_Step_4.zip"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Unzip project files automatically"
          git push
