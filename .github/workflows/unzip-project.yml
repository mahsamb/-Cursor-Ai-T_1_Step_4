name: Unzip project on GitHub

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and copy files to repo root
        run: |
          set -e
          ZIP="Cursor Ai-T_1_Step_4.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP file not found: $ZIP"
            ls -la
            exit 1
          fi

          # checkout makes files read-only; cp/mv into workspace fails without this
          chmod -R u+w "$GITHUB_WORKSPACE"

          mkdir -p /tmp/extracted
          unzip -q "$ZIP" -d /tmp/extracted

          SRC="/tmp/extracted/Cursor Ai-T_1_Step_4"
          if [ ! -d "$SRC" ]; then
            echo "Expected folder not found after unzip:"
            find /tmp/extracted -maxdepth 2
            exit 1
          fi

          shopt -s dotglob
          cp -r "$SRC"/* "$GITHUB_WORKSPACE"/

          rm -f "$GITHUB_WORKSPACE/$ZIP"
          rm -rf /tmp/extracted
          find "$GITHUB_WORKSPACE" -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          rm -f "$GITHUB_WORKSPACE/shop.db" "$GITHUB_WORKSPACE/desktop.ini" 2>/dev/null || true

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Unzip project files automatically"
          git push
